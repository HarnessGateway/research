<!doctype html>
<!-- The console: one page that uses the core through POST /v1/responses and nothing else. No library, no build
     step. It draws a conversation from Responses payloads alone, so it shows any harness's work the same way. -->
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Core console</title>
<style>
  :root { --bg: #fafaf9; --ink: #1b1a19; --muted: #6e6b66; --line: #dedbd6; --sunk: #f0efec; --accent: #5b5bd6; --bad: #c0362c; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111112; --ink: #ededee; --muted: #9a9aa2; --line: #2e2e33; --sunk: #1c1c1f; --accent: #9b9bf7; --bad: #ff8d83; } }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 14px/1.55 system-ui, sans-serif; }
  header, form { display: flex; gap: 8px; padding: 10px 16px; align-items: center; flex-wrap: wrap; }
  header { border-bottom: 1px solid var(--line); } form { border-top: 1px solid var(--line); align-items: flex-end; }
  input, textarea, button { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  input, textarea { flex: 1; min-width: 180px; } #model { font-family: ui-monospace, monospace; } textarea { resize: none; height: 60px; }
  button { cursor: pointer; } button.go { background: var(--ink); color: var(--bg); border-color: var(--ink); } button:disabled { opacity: .4; cursor: default; }
  #session, .who, .small { color: var(--muted); font: 12px ui-monospace, monospace; }
  main { flex: 1; overflow: auto; padding: 20px 16px; } main > * { max-width: 780px; margin: 0 auto 14px; }
  .said { background: var(--sunk); padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; width: fit-content; margin-left: auto; margin-right: max(0px, calc((100% - 780px) / 2)); }
  .text { white-space: pre-wrap; word-break: break-word; margin: 8px 0; } .bad { color: var(--bad); }
  .step { font: 12.5px ui-monospace, monospace; margin: 6px 0 2px; word-break: break-all; }
  pre { margin: 2px 0 8px; padding: 8px 10px; background: var(--sunk); border-radius: 8px; font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow: auto; }
  details { margin: 4px 0; } summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
</style>
<header>
  <input id="model" placeholder="harness/provider/model" spellcheck="false" autocomplete="off" title="The model line: which harness runs the request, and with which provider and model">
  <input id="instructions" placeholder="Instructions for the next request (optional)" autocomplete="off">
  <button id="fresh" type="button" title="The next message starts a new session">New session</button>
  <span id="session"></span>
</header>
<main id="log"></main>
<form id="form">
  <textarea id="input" placeholder="Ask the agent to do something. Enter sends." required></textarea>
  <button class="go" id="send">Send</button>
</form>
<script>
"use strict";
const $ = id => document.getElementById(id);
// Every node is made here, and what an agent printed is only ever text: nothing it says becomes markup.
const h = (tag, cls, ...children) => { const node = document.createElement(tag); node.className = cls || ""; node.append(...children.filter(child => child != null && child !== "")); return node; };
const fold = (label, text) => h("details", "", h("summary", "", label), h("pre", "", text));
const kept = { get model() { try { return localStorage.getItem("model"); } catch { return null; } }, set model(value) { try { localStorage.setItem("model", value); } catch { /* not kept */ } } };
let previous = null;                              // the response the next request continues from: the whole of a session, to a client

/** One output item of a response, as what a reader sees of it. A call and what came of it are two items. */
function item(each) {
  const texts = (each.content || each.summary || []).map(part => part.text || part.refusal || "").join("");
  const action = each.action || {}, operation = each.operation || {}, results = each.output;
  switch (each.type) {
    case "message": return h("div", "text", texts);
    case "reasoning": return texts ? fold("Thought", texts) : null;
    case "shell_call": return h("div", "step", `$ ${(action.commands || []).join(" && ")}`);
    case "shell_call_output": {                    // a command that printed nothing and ended well shows nothing
      const printed = results.map(result => (result.stdout || "") + (result.stderr || "")
        + (result.outcome.type === "timeout" ? "\n(ran out of time)" : result.outcome.exit_code ? `\n(exit ${result.outcome.exit_code})` : "")).join("");
      return printed ? h("pre", "", printed) : null;
    }
    case "apply_patch_call": return h("div", "", h("div", "step", `${operation.type.replace("_file", "")} ${operation.path}`), operation.diff && h("pre", "", operation.diff));
    case "apply_patch_call_output": return each.status === "failed" ? h("pre", "bad", each.output || "failed") : null;
    case "mcp_list_tools": return h("div", each.error ? "step bad" : "step", `${each.server_label}: ${each.error || each.tools.map(tool => tool.name).join(", ")}`);
    case "mcp_call": return h("div", "", h("div", "step", `${each.server_label}.${each.name} ${each.arguments}`),
      h("pre", each.error ? "bad" : "", each.error ? String(each.error.content || each.error.message) : each.output || `(${each.status})`));
    case "web_search_call": return h("div", "step", action.url ? `opened ${action.url}` : `searched ${action.query || "the web"}`);
    case "custom_tool_call": return h("div", "step", `${each.name} ${each.input}`);
    case "custom_tool_call_output": return each.output ? h("pre", "", typeof each.output === "string" ? each.output : JSON.stringify(each.output)) : null;
    default: return fold(each.type, JSON.stringify(each, null, 2));       // an item this page has no words for is shown as it is
  }
}

/** A response, drawn: who answered, each item, how it ended and what it used, and the payload itself. */
function reply(response) {
  const used = response.usage, how = response.status === "completed" ? "" : response.status;
  return h("div", "", h("div", "who", response.model), ...(response.output || []).map(item),
    response.error && h("div", "text bad", response.error.message),
    h("div", "small", [how, used && `${used.input_tokens} tokens in, ${used.output_tokens} out`].filter(Boolean).join(" · ")),
    fold("Response", JSON.stringify(response, null, 2)));
}

async function send(event) {
  event.preventDefault();
  const input = $("input").value.trim(), model = $("model").value.trim(), instructions = $("instructions").value.trim();
  if (!input || !model) return;
  kept.model = model;
  const waiting = h("div", "small", "working…"), started = Date.now();
  $("log").append(h("div", "said", input), waiting);
  $("input").value = "";
  $("send").disabled = true;
  const clock = setInterval(() => { waiting.textContent = `working… ${Math.round((Date.now() - started) / 1000)} s`; waiting.scrollIntoView(); }, 1000);
  try {
    const answer = await fetch("/v1/responses", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model, input, ...(instructions && { instructions }), ...(previous && { previous_response_id: previous }) }) });
    const response = await answer.json();
    if (!answer.ok) throw new Error(response.error.message);
    previous = response.id;                       // a failed turn is a response too, and the session carries on from it
    $("session").textContent = response.metadata.hg_session;
    waiting.replaceWith(reply(response));
  } catch (error) {
    waiting.replaceWith(h("div", "text bad", error.message));
  }
  clearInterval(clock);
  $("send").disabled = false;
  $("log").lastChild.scrollIntoView();
  $("input").focus();
}

$("model").value = kept.model || "";
$("form").addEventListener("submit", send);
$("input").addEventListener("keydown", event => { if (event.key === "Enter" && !event.shiftKey && !event.isComposing) { event.preventDefault(); $("form").requestSubmit(); } });
$("fresh").addEventListener("click", () => { previous = null; $("session").textContent = ""; $("log").replaceChildren(); $("input").focus(); });
$("input").focus();
</script>
</html>
